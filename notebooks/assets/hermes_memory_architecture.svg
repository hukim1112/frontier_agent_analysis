<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" style="width: 100%; height: auto; background: #0f172a; border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="l4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="12" />

  <!-- Title Header -->
  <text x="450" y="28" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Hermes Agent: 4-Layer Memory &amp; Closed Learning Loop</text>

  <!-- L1: Working Memory Box -->
  <g transform="translate(40, 45)">
    <rect width="240" height="195" rx="10" fill="url(#l1Grad)" stroke="#60a5fa" stroke-width="1.5" filter="url(#glow)" />
    <text x="120" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L1: Working Memory</text>
    <text x="120" y="45" fill="#93c5fd" font-size="10" text-anchor="middle">(LangGraph Checkpointer)</text>
    
    <rect x="15" y="60" width="210" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="25" y="79" fill="#e0f2fe" font-size="11">Current Session Messages</text>
    
    <rect x="15" y="98" width="210" height="30" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
    <text x="25" y="117" fill="#e0f2fe" font-size="11">Checkpoints DB (checkpoints.db)</text>

    <rect x="15" y="136" width="210" height="42" rx="5" fill="#1d4ed8" opacity="0.7" />
    <text x="120" y="154" fill="#ffffff" font-size="10" text-anchor="middle">Short-term Conversation State</text>
    <text x="120" y="168" fill="#cbd5e1" font-size="9" text-anchor="middle">Thread-scoped (Turn-by-turn)</text>
  </g>

  <!-- Arrow L1 to Agent Execution -->
  <path d="M 280 142.5 L 350 142.5" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Agent Execution Core -->
  <g transform="translate(360, 45)">
    <rect width="220" height="195" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="28" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Frontier Agent Core</text>
    <text x="110" y="45" fill="#94a3b8" font-size="10" text-anchor="middle">(ReAct Loop Execution)</text>

    <rect x="15" y="60" width="190" height="28" rx="5" fill="#0f172a" stroke="#475569" />
    <text x="105" y="78" fill="#f1f5f9" font-size="10" text-anchor="middle">before_agent (Prefetch/Recall)</text>

    <rect x="15" y="98" width="190" height="28" rx="5" fill="#0f172a" stroke="#475569" />
    <text x="105" y="116" fill="#f1f5f9" font-size="10" text-anchor="middle">4-Layer PromptAssembler</text>

    <rect x="15" y="136" width="190" height="42" rx="5" fill="#831843" stroke="#ec4899" stroke-width="1" />
    <text x="105" y="154" fill="#fbcfe8" font-size="10" font-weight="bold" text-anchor="middle">after_agent (Hook Trigger)</text>
    <text x="105" y="168" fill="#f472b6" font-size="9" text-anchor="middle">Spawns Daemon Review Thread</text>
  </g>

  <!-- Closed Learning Loop Box -->
  <g transform="translate(620, 45)">
    <rect width="240" height="195" rx="10" fill="url(#loopGrad)" stroke="#f472b6" stroke-width="1.5" filter="url(#glow)" />
    <text x="120" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Closed Learning Loop</text>
    <text x="120" y="45" fill="#fbcfe8" font-size="10" text-anchor="middle">(Background Review Thread)</text>

    <rect x="15" y="58" width="210" height="36" rx="5" fill="#831843" stroke="#f472b6" stroke-width="1" />
    <text x="120" y="73" fill="#ffffff" font-size="10" text-anchor="middle">1. LLM Conversation Review</text>
    <text x="120" y="86" fill="#fbcfe8" font-size="9" text-anchor="middle">Fact Extraction &amp; Knowledge Audit</text>

    <rect x="15" y="100" width="210" height="36" rx="5" fill="#831843" stroke="#f472b6" stroke-width="1" />
    <text x="120" y="115" fill="#ffffff" font-size="10" text-anchor="middle">2. Auto-Invoke memory() Tool</text>
    <text x="120" y="128" fill="#fbcfe8" font-size="9" text-anchor="middle">memory(action='add', target=...)</text>

    <rect x="15" y="142" width="210" height="36" rx="5" fill="#831843" stroke="#f472b6" stroke-width="1" />
    <text x="120" y="157" fill="#ffffff" font-size="10" text-anchor="middle">3. Session Summarization</text>
    <text x="120" y="170" fill="#fbcfe8" font-size="9" text-anchor="middle">English Summary + FTS5 Indexing</text>
  </g>

  <!-- Arrow Agent to Loop -->
  <path d="M 580 162.5 L 620 162.5" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-pink)" />
  <text x="600" y="152.5" fill="#ec4899" font-size="10" font-weight="bold" text-anchor="middle">Async</text>

  <!-- Downward Arrows to L2, L3, L4 -->
  <path d="M 680 240 L 680 275 Q 680 290 660 290 L 260 290" fill="none" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />
  <text x="460" y="283" fill="#93c5fd" font-size="10" text-anchor="middle">Write Session Summary &amp; Messages</text>

  <path d="M 740 240 L 740 320 Q 740 330 720 330 L 560 330" fill="none" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <text x="650" y="323" fill="#6ee7b7" font-size="10" text-anchor="middle">Update MEMORY.md / USER.md</text>

  <!-- L2: Episodic Memory Box -->
  <g transform="translate(40, 300)">
    <rect width="240" height="185" rx="10" fill="url(#l2Grad)" stroke="#a78bfa" stroke-width="1.5" />
    <text x="120" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L2: Episodic Memory</text>
    <text x="120" y="44" fill="#ddd6fe" font-size="10" text-anchor="middle">(SQLite - episodic.db)</text>

    <rect x="15" y="55" width="210" height="32" rx="5" fill="#4c1d95" stroke="#8b5cf6" />
    <text x="25" y="74" fill="#f5f3ff" font-size="10">sessions_fts (English Summaries)</text>

    <rect x="15" y="93" width="210" height="32" rx="5" fill="#4c1d95" stroke="#8b5cf6" />
    <text x="25" y="112" fill="#f5f3ff" font-size="10">messages_fts (Anchor &amp; Lineage)</text>

    <text x="120" y="148" fill="#c4b5fd" font-size="10" text-anchor="middle">Tools: session_search, session_recall</text>
    <text x="120" y="164" fill="#a78bfa" font-size="9" text-anchor="middle">Bookends (Start 3 + Tail 3 + Window)</text>
  </g>

  <!-- L3: Semantic Memory Box -->
  <g transform="translate(320, 300)">
    <rect width="240" height="185" rx="10" fill="url(#l3Grad)" stroke="#34d399" stroke-width="1.5" />
    <text x="120" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L3: Semantic Memory</text>
    <text x="120" y="44" fill="#a7f3d0" font-size="10" text-anchor="middle">(Markdown Files with '§' Delimiter)</text>

    <rect x="15" y="55" width="210" height="32" rx="5" fill="#064e3b" stroke="#10b981" />
    <text x="25" y="74" fill="#ecfdf5" font-size="10">MEMORY.md (Env &amp; Project Facts)</text>

    <rect x="15" y="93" width="210" height="32" rx="5" fill="#064e3b" stroke="#10b981" />
    <text x="25" y="112" fill="#ecfdf5" font-size="10">USER.md (User Profile &amp; Style)</text>

    <text x="120" y="148" fill="#6ee7b7" font-size="10" text-anchor="middle">Pattern: Frozen System Prompt Snapshot</text>
    <text x="120" y="164" fill="#34d399" font-size="9" text-anchor="middle">Disk-immediate Write + Capacity Bounded</text>
  </g>

  <!-- L4: Procedural Memory Box -->
  <g transform="translate(600, 300)">
    <rect width="260" height="185" rx="10" fill="url(#l4Grad)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="130" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">L4: Procedural Memory</text>
    <text x="130" y="44" fill="#fef3c7" font-size="10" text-anchor="middle">(Skills &amp; Subagent Workflows)</text>

    <rect x="15" y="55" width="230" height="32" rx="5" fill="#78350f" stroke="#f59e0b" />
    <text x="25" y="74" fill="#fffbeb" font-size="10">Skills Directory (SKILL.md / scripts)</text>

    <rect x="15" y="93" width="230" height="32" rx="5" fill="#78350f" stroke="#f59e0b" />
    <text x="25" y="112" fill="#fffbeb" font-size="10">Learned Workflows &amp; Rule Updates</text>

    <text x="130" y="148" fill="#fcd34d" font-size="10" text-anchor="middle">Refining Agent Tooling &amp; Subagents</text>
    <text x="130" y="164" fill="#fbbf24" font-size="9" text-anchor="middle">Self-improving Procedural Capability</text>
  </g>

  <!-- Feedback Arrow from L2/L3 to Prompt Layer 3 -->
  <path d="M 440 300 L 440 255 Q 440 245 420 245 L 220 245 Q 200 245 200 235" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)" />
  <text x="320" y="238" fill="#38bdf8" font-size="10" text-anchor="middle">before_agent Prefetch → Prompt Layer 3 (recalled_memory)</text>

</svg>